name: Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 5
    runs-on: self-hosted
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Run Jest tests
        run: npm test

  test_e2e:
    timeout-minutes: 60
    runs-on: self-hosted
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'src/frontend/package-lock.json'
      - name: Diagnose runner environment
        run: |
          echo "--- uname ---"; uname -a
          echo "--- pwd ---"; pwd
          echo "--- which node/npm/npx ---"
          which node; which npm; which npx
          echo "--- type -a ---"
          type -a node; type -a npm; type -a npx
          echo "--- node platform ---"
          node -p "process.platform + ' ' + process.arch + ' ' + process.execPath"
          echo "--- RUNNER_* env ---"
          env | grep -E '^(RUNNER_|GITHUB_)' | sort
          echo "--- PATH ---"
          echo "$PATH" | tr ':' '\n'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 30
